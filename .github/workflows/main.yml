name: My Second Practice

on:
  push:
   branches:
    - main

jobs:
 test:
  runs-on: ubuntu-latest

  steps:
   - name: Step one 
     uses: actions/checkout@v4
     
   - name: Build Docker Image
     run: docker build -t first-project .
     
   - name: Tag Docker Image
     run: docker tag first-project ${{ secrets.DOCKERHUB_USERNAME }}/first-project:latest

   - name: Log in to Docker Hub
     uses: docker/login-action@v3
     with:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN}}

   - name: Push Docker image 
     run: docker push ${{ secrets.DOCKERHUB_USERNAME}}/first-project:latest
    
  
  










